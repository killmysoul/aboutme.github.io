<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location Access Required</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      background-color: #f2f2f2;
    }
    .container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>To continue, please allow access to your location.</h2>
    <button onclick="requestLocation()">Allow Location Access</button>
    <p id="status"></p>
  </div>

  <script>
    function requestLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            document.getElementById("status").textContent =
              "Location access granted. Latitude: " + position.coords.latitude +
              ", Longitude: " + position.coords.longitude;
            // You can redirect or continue your logic here
          },
          function(error) {
            document.getElementById("status").textContent = 
              "Location access denied or unavailable.";
          }
        );
      } else {
        document.getElementById("status").textContent =
          "Geolocation is not supported by this browser.";
      }
    }
  </script>

</body>
</html>
